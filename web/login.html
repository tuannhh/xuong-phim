<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xưởng phim — đăng nhập</title>
<style>
:root{--navy:#103A7A;--bg:#F6F4EE;--panel:#fff;--ink:#171A22;--mut:#646A78;--line:#E2DED1;--red:#D92D20}
@media (prefers-color-scheme:dark){:root{--bg:#0F1117;--panel:#181B23;--ink:#ECEEF3;--mut:#9AA0AD;--line:#2B303B;--red:#FF6B5E}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:14px}
h1{margin:0;font-size:22px;color:var(--navy)}
@media (prefers-color-scheme:dark){h1{color:#A9C4FF}}
p{margin:0;color:var(--mut);font-size:14px}
input{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px;background:#F4D81C;color:#171A22;cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--red);font-size:14px;min-height:1.5em}
</style>
</head>
<body>
<form id="f">
  <h1>Xưởng phim</h1>
  <p>Đang mở từ xa — nhập mật khẩu truy cập (đặt ở trang Thiết lập trên máy chạy xưởng).</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Mật khẩu" autofocus required>
  <button id="go">Vào xưởng</button>
  <div id="err"></div>
</form>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json', 'x-xuong': '1' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Lỗi ${r.status}`);
    location.reload();
  } catch (x) { err.textContent = x.message; go.disabled = false; }
};
</script>
</body>
</html>
