<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xưởng series</title>
<style>
:root{--bg:#F6F4EE;--panel:#fff;--soft:#F0EDE3;--ink:#171A22;--mut:#646A78;--line:#E2DED1;--y:#F4D81C;--yd:#C9AE00;--red:#D92D20;--ok:#15884B;--warn:#B45309;--blue:#2457C5;--sh:0 1px 2px rgba(20,24,38,.06),0 6px 22px rgba(20,24,38,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0F1117;--panel:#181B23;--soft:#20242E;--ink:#ECEEF3;--mut:#9AA0AD;--line:#2B303B;--yd:#F4D81C;--red:#FF6B5E;--ok:#3DDC84;--warn:#F5B454;--blue:#8AB0FF;--sh:none}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
header.top{position:sticky;top:0;z-index:20;background:#141826;color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;height:56px}
header.top .brand{font-weight:800;font-size:18px;letter-spacing:.01em;color:#fff;text-decoration:none;display:flex;align-items:center;gap:10px}
header.top .brand i{width:26px;height:26px;border-radius:8px;background:var(--y);display:grid;place-items:center;color:#141826;font-style:normal;font-size:15px}
header.top nav{display:flex;gap:4px;flex:1}
header.top nav a{color:#C9CEDB;text-decoration:none;padding:7px 12px;border-radius:9px;font-weight:600;font-size:14px}
header.top nav a.on,header.top nav a:hover{background:#262C40;color:#fff}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:650;background:var(--soft);color:var(--mut);white-space:nowrap}
.pill.run{background:#FFF3BF;color:#6B5600}.pill.ok{background:#DDF5E7;color:#0E6B3A}.pill.bad{background:#FDE4E1;color:#A32117}.pill.info{background:#E3ECFF;color:#1F4AA8}
@media (prefers-color-scheme:dark){.pill.run{background:#4A3F08;color:#FFE873}.pill.ok{background:#10381F;color:#7BE6A8}.pill.bad{background:#4A1712;color:#FFA79E}.pill.info{background:#182B55;color:#A9C4FF}}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}.pill.run .dot{animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
main{max-width:1240px;margin:0 auto;padding:26px 20px 90px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:16px;margin:0}
.lead{color:var(--mut);margin:0 0 22px;max-width:760px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
@media (max-width:1040px){.cols{display:flex;flex-direction:column}.cols>*{width:100%}.side{display:contents}#jobbox{order:-1}}
.side{position:sticky;top:76px;display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 15px;font-weight:650;cursor:pointer;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--y);border-color:var(--yd);color:#141826}
.btn.pri:hover{filter:brightness(.96)}
.btn.dark{background:#141826;border-color:#141826;color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn .ai{font-size:11px;font-weight:800;background:#141826;color:var(--y);border-radius:5px;padding:1px 5px;letter-spacing:.04em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.mut{color:var(--mut)}.small{font-size:13px}
label.f,div.f{display:grid;gap:5px;font-weight:650;font-size:13.5px}
label.f span.h,div.f span.h{font-weight:400;color:var(--mut);font-size:12.5px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--yd);box-shadow:0 0 0 3px rgba(244,216,28,.3)}
textarea{resize:vertical;min-height:74px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fg .w2{grid-column:1/-1}
@media (max-width:700px){.fg{grid-template-columns:1fr}}
.sec{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;padding:22px 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0;padding-top:4px}
.sec>div:first-child p{color:var(--mut);font-size:13.5px;margin:4px 0 0}
.sec .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#141826;color:var(--y);font-weight:800;font-size:13px;margin-right:8px}
@media (max-width:820px){.sec{grid-template-columns:1fr;gap:12px}}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;text-align:left}
.seg button small{display:block;font-weight:400;color:var(--mut);font-size:12.5px;max-width:230px}
.seg button.on{border-color:#141826;box-shadow:inset 0 0 0 1.5px #141826;background:#FFFBE0}
@media (prefers-color-scheme:dark){.seg button.on{border-color:var(--y);box-shadow:inset 0 0 0 1.5px var(--y);background:#2A2710}}
.sw{display:flex;align-items:center;gap:10px}
.sw i{width:44px;height:44px;border-radius:10px;position:relative;flex:none;border:1px solid rgba(0,0,0,.15)}
.sw i b{position:absolute;right:5px;bottom:5px;width:14px;height:14px;border-radius:50%}
.sw i u{position:absolute;left:6px;top:7px;width:20px;height:4px;border-radius:2px}
.chr{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;background:var(--panel)}
.chr .hd{display:flex;align-items:center;gap:10px}
.chr .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--y);color:#141826;flex:none}
.chr .av.v{background:#3A1512;color:#FFB4AB}
.chr .g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.chr .g{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ck{display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:14px;cursor:pointer}
.ck input{width:16px;height:16px;accent-color:#141826}
input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 22px}
.steps>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:11px;align-items:center}
.steps b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);font-size:14px;flex:none}
.steps .done b{background:var(--ok);color:#fff}.steps .cur b{background:var(--y);color:#141826}
.steps span{display:block;font-weight:700;line-height:1.2}.steps small{color:var(--mut)}
@media (max-width:700px){.steps{grid-template-columns:1fr}}
.ep{display:grid;gap:14px}
.ep .hd{display:flex;gap:14px;align-items:flex-start}
.ep .no{font-weight:800;font-size:26px;line-height:1;color:var(--mut);min-width:40px;font-variant-numeric:tabular-nums}
.ep p{margin:0}.ep ol{margin:0;padding-left:20px}
.ep .k{display:inline-block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-right:8px}
.board{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.board img{height:230px;border-radius:9px;border:1px solid var(--line);cursor:zoom-in;flex:none;background:#000}
.film{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.film video{width:230px;aspect-ratio:9/16;border-radius:12px;background:#000;object-fit:contain}
.film video.wide{aspect-ratio:16/9;width:100%}
@media (max-width:640px){.film{grid-template-columns:1fr}.film video{width:100%;max-width:300px}}
.note{background:var(--soft);border-radius:11px;padding:10px 13px;font-size:13.5px}
.note.warn{background:#FFF1D6;color:#7A4A00}.note.bad{background:#FDE4E1;color:#8E1B12}
@media (prefers-color-scheme:dark){.note.warn{background:#3D2C08;color:#FFD591}.note.bad{background:#4A1712;color:#FFB4AB}}
pre.log{margin:0;background:#0E1118;color:#D6DAE4;border-radius:11px;padding:12px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.sum{white-space:pre-wrap;font-size:14px}
.chars{width:100%;border-radius:11px;border:1px solid var(--line);cursor:zoom-in;display:block;background:#F3F1EA}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.list a.card{text-decoration:none;color:inherit;display:grid;gap:10px;transition:transform .12s,border-color .12s}
.list a.card:hover{border-color:var(--mut);transform:translateY(-2px)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
details>summary{cursor:pointer;font-weight:650;color:var(--mut);font-size:13.5px}
details[open]>summary{margin-bottom:10px}
#lb{position:fixed;inset:0;background:rgba(8,10,16,.9);display:none;place-items:center;z-index:50;cursor:zoom-out;padding:20px}
#lb img{max-width:100%;max-height:100%;border-radius:10px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#141826;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;z-index:60;display:none;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.bad{background:#A32117}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:26px 0 14px;display:flex;gap:10px;align-items:center;justify-content:flex-end}
code.cmd{display:block;background:var(--soft);border-radius:9px;padding:9px 11px;font:12.5px/1.5 ui-monospace,Menlo,monospace;word-break:break-word}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><i>▶</i>Xưởng series</a>
  <nav><a href="#/" id="nav-home">Series của tôi</a><a href="#/new" id="nav-new">+ Series mới</a><a href="#/drive" id="nav-drive">Google Drive</a></nav>
  <a id="jobpill" class="pill" style="display:none;text-decoration:none"></a>
</header>
<main id="app"></main>
<div id="lb"><img alt=""></div>
<div id="toast"></div>
<script>
'use strict';
// ───────── tiện ích dựng DOM (mọi chữ đi qua textContent — không chèn HTML thô)
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'open' || k === 'selected') el[k] = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
};
const app = document.getElementById('app');
const api = async (method, url, body) => {
  const r = await fetch(url, { method, headers: method === 'GET' ? {} : { 'content-type': 'application/json', 'x-xuong': '1' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Lỗi ${r.status}`);
  return j;
};
let toastT;
const toast = (msg, bad) => { const t = document.getElementById('toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => (t.style.display = 'none'), bad ? 6000 : 3200); };
const lb = document.getElementById('lb');
lb.onclick = () => (lb.style.display = 'none');
const zoom = (src) => { lb.firstElementChild.src = src; lb.style.display = 'grid'; };
const copy = async (text) => { try { await navigator.clipboard.writeText(text); toast('Đã chép câu lệnh.'); } catch { prompt('Chép câu lệnh này:', text); } };
const epDir = (n) => `ep${String(n).padStart(2, '0')}`;
const mmss = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

// ───────── nhãn
const THEME = { 'misa-vang': 'MISA vàng – navy', 'misa-sang': 'MISA sáng', 'toi-cong-nghe': 'Tối công nghệ', 'canh-bao': 'Cảnh báo đỏ', 'giay-am': 'Giấy ấm', 'vui-tuoi': 'Vui tươi' };
const KIND = { misa: 'Polo MISA (vàng + logo)', 'so-mi': 'Sơ mi', vest: 'Vest', hoodie: 'Hoodie', 'ao-thun': 'Áo thun', cardigan: 'Cardigan' };
const HAIR = { ngan: 'ngắn', vuot: 'vuốt ngược', tia: 'tỉa', xoan: 'xoăn', hoi: 'hói', dai: 'dài', buoc: 'buộc đuôi', bob: 'bob', bui: 'búi' };
const MOOD = { tension: 'Hồi hộp', lofi: 'Lofi thư thả', upbeat: 'Sôi động', inspire: 'Truyền cảm hứng', playful: 'Vui nhộn', calm: 'Êm dịu' };
const STYLE = { 'tinh-huong': ['Phim tình huống', 'Nhân vật diễn trong bối cảnh (văn phòng, nhà…), có máy quay, nhãn bật, màn hình điện thoại'], 'thong-tin': ['Đồ hoạ thông tin', 'Người dẫn + danh sách, số liệu, so sánh — hợp nội dung mẹo, kiến thức'], 'ket-hop': ['Kết hợp', 'Mở bằng tình huống, chốt bằng phần tổng kết thông tin'] };
const SETS = { 'van-phong': 'Văn phòng', nha: 'Ở nhà', 'hang-o': 'Sào huyệt kẻ gian' };
const MODE = { 'dong-nhat': ['Một dàn nhân vật xuyên suốt', 'Khán giả quen mặt qua từng tập'], 'moi-tap': ['Mỗi tập nhân vật khác', 'Claude tự đặt nhân vật cho từng tập'], khong: ['Không dùng nhân vật', 'Chỉ đồ hoạ và giọng dẫn'] };
const PLATFORMS = ['TikTok', 'Facebook Reels', 'YouTube Shorts', 'YouTube', 'Zalo'];

// ───────── trạng thái chung
let META = null, JOB = null, LOG = [], CUR = null, VIEW = '', DRIVE = null;
const DRAFT = new Map(); // góp ý đang gõ, giữ qua các lần vẽ lại
const busy = () => JOB && (JOB.status === 'running' || JOB.status === 'stopping');

// ───────── công việc chạy nền
const jobPill = () => {
  const p = document.getElementById('jobpill');
  if (!JOB) return (p.style.display = 'none');
  p.style.display = '';
  p.href = `#/s/${JOB.slug}`;
  const run = busy();
  p.className = `pill ${run ? 'run' : JOB.status === 'done' ? 'ok' : JOB.status === 'error' ? 'bad' : ''}`;
  p.replaceChildren(h('span', { class: 'dot' }), `${JOB.label}${JOB.episode ? ` · tập ${JOB.episode}` : ''} — ${run ? mmss(Date.now() - JOB.started) : JOB.status === 'done' ? 'xong' : JOB.status === 'error' ? 'lỗi' : 'đã dừng'}`);
};
const jobPanel = () => {
  const box = document.getElementById('jobbox');
  if (!box) return;
  const mine = JOB && CUR && JOB.slug === CUR.slug;
  if (!mine) return box.replaceChildren(h('h3', {}, 'Tiến trình'), h('p', { class: 'mut small', style: { margin: '6px 0 0' } }, JOB && busy() ? `Đang chạy việc của series khác (${JOB.slug}). Mỗi lúc chỉ chạy một việc.` : 'Chưa có việc nào đang chạy. Bấm một nút bên trái để bắt đầu.'));
  const run = busy();
  const old = box.querySelector('pre');
  const stick = !old || old.scrollTop + old.clientHeight >= old.scrollHeight - 30;
  const pre = h('pre', { class: 'log' }, LOG.join('\n'));
  box.replaceChildren(...[
    h('div', { class: 'row' }, h('h3', {}, 'Tiến trình'), h('span', { class: 'sp' }),
      h('span', { class: `pill ${run ? 'run' : JOB.status === 'done' ? 'ok' : JOB.status === 'error' ? 'bad' : ''}` }, h('span', { class: 'dot' }), run ? `đang chạy ${mmss(Date.now() - JOB.started)}` : JOB.status === 'done' ? `xong sau ${mmss(JOB.ended - JOB.started)}` : JOB.status === 'error' ? 'lỗi' : 'đã dừng'),
      run && h('button', { class: 'btn sm danger', onclick: async () => { await api('POST', '/api/job/stop', {}); toast('Đang dừng…'); } }, 'Dừng')),
    h('div', { class: 'small mut', style: { margin: '4px 0 10px' } }, `${JOB.label}${JOB.episode ? ` · tập ${JOB.episode}` : ''}`),
    !run && JOB.hint ? h('div', { class: 'note warn', style: { marginBottom: '10px' } }, JOB.hint) : null,
    !run && JOB.summary ? h('div', { class: 'note sum', style: { marginBottom: '10px' } }, h('b', {}, ['plan', 'script', 'fix'].includes(JOB.action) ? 'Claude báo lại: ' : 'Kết quả: '), JOB.summary) : null,
    pre].filter(Boolean));
  if (stick) pre.scrollTop = pre.scrollHeight;
};
let pollT;
const poll = async () => {
  clearTimeout(pollT);
  try {
    const wasBusy = busy(), prevId = JOB?.id;
    const from = JOB ? Math.max(0, LOG.length - 1) : 0;
    const { job } = await api('GET', `/api/job?from=${from}`);
    if (job) {
      if (job.id !== prevId) { const full = from ? (await api('GET', '/api/job?from=0')).job : job; LOG = full.log; JOB = full; }
      else { LOG.length = Math.min(from, LOG.length); LOG.push(...job.log); JOB = job; }
    }
    jobPill(); jobPanel();
    if (wasBusy && !busy()) {
      toast(JOB.status === 'done' ? `${JOB.label}: xong.` : JOB.status === 'error' ? `${JOB.label}: có lỗi — xem tiến trình.` : 'Đã dừng.', JOB.status === 'error');
      if (CUR && JOB.slug === CUR.slug && VIEW === 'series') await openSeries(CUR.slug, true);
    } else if (wasBusy !== busy()) syncButtons();
  } catch { /* máy chủ tạm ngắt — thử lại */ }
  pollT = setTimeout(poll, busy() ? 1000 : 4000);
};
const syncButtons = () => document.querySelectorAll('[data-job]').forEach((b) => (b.disabled = busy()));
const runJob = async (slug, action, episode, feedback) => {
  try {
    const { job } = await api('POST', `/api/series/${slug}/jobs`, { action, episode, feedback });
    JOB = job; LOG = job.log.slice();
    if (feedback) DRAFT.delete(`${slug}:${action}:${episode ?? ''}`), DRAFT.delete(`${slug}:fix:${episode ?? ''}`);
    jobPill(); jobPanel(); syncButtons(); poll();
    document.getElementById('jobbox')?.scrollIntoView({ block: 'nearest' });
  } catch (e) { toast(e.message, true); }
};
const cmdText = (slug, action, n) => `/series Làm theo mục "Chế độ form" của skill. Giai đoạn: ${action}. Series: ${slug}.${n ? ` Tập: ${n}.` : ''}`;
// nút giao việc cho Claude (hoặc chép lệnh khi máy không có `claude`)
const aiBtn = (label, slug, action, n, getFb, cls = 'pri') => META.claude
  ? h('button', { class: `btn ${cls}`, 'data-job': 1, disabled: busy(), onclick: () => { const fb = getFb ? getFb() : ''; if (action === 'fix' && !fb.trim()) return toast('Hãy ghi góp ý trước.', true); runJob(slug, action, n, fb); } }, h('span', { class: 'ai' }, 'AI'), label)
  : h('button', { class: `btn ${cls}`, onclick: () => copy(cmdText(slug, action, n)) }, 'Chép lệnh: ', label);
const fbBox = (key, ph) => { const t = h('textarea', { placeholder: ph, value: DRAFT.get(key) ?? '', oninput: () => DRAFT.set(key, t.value) }); return t; };

// ───────── trang danh sách
const home = async () => {
  VIEW = 'home'; CUR = null;
  const [list, doc] = await Promise.all([api('GET', '/api/series'), api('GET', '/api/doctor')]);
  app.replaceChildren(
    h('div', { class: 'row', style: { marginBottom: '6px' } }, h('h1', {}, 'Series của tôi'), h('span', { class: 'sp' }), h('a', { class: 'btn pri', href: '#/new' }, '+ Tạo series mới')),
    h('p', { class: 'lead' }, 'Điền đề bài một lần, rồi duyệt ba bước ngay trên trang: kế hoạch từng tập → kịch bản và storyboard → phim hoàn chỉnh.'),

         h('div', {}, h('button', { class: 'btn pri', disabled: !D.configured, onclick: () => driveConnect('#/drive') }, 'Kết nối Google Drive'))]);
  app.replaceChildren(h('h1', {}, 'Google Drive'), h('p', { class: 'lead' }, 'Kết nối một lần cho máy này; sau đó phim thành phẩm có thể tự đẩy lên Drive của bạn.'),
    h('div', { class: 'grid', style: { maxWidth: '820px' } }, D.configured ? [connect, h('details', { class: 'card' }, h('summary', {}, 'OAuth client'), setup)] : [setup, connect]));
};

// ───────── trang một series
const openSeries = async (slug, keepScroll) => {
  VIEW = 'series';
  const y = window.scrollY;
  const d = (CUR = await api('GET', `/api/series/${slug}`));
  const eps = d.episodes;
  const nPlan = d.planned, nScript = eps.filter((e) => e.scenes).length, nFilm = eps.filter((e) => e.mp4).length;
  const pending = eps.filter((e) => !e.approved);
  const step = (n, title, sub, state) => h('div', { class: state }, h('b', {}, state === 'done' ? '✓' : n), h('div', {}, h('span', {}, title), h('small', {}, sub)));
  const file = (rel, t) => `/files/${slug}/${rel}${t ? `?t=${Math.round(t)}` : ''}`;

  const epCard = (e) => {
    const base = `episodes/${e.id}`;
    const state = !e.approved ? 'de-xuat' : !e.scenes ? 'duyet' : !e.mp4 ? 'kich-ban' : 'phim';
    const chip = { 'de-xuat': ['', 'Chờ duyệt kế hoạch'], duyet: ['info', 'Đã duyệt — chưa có kịch bản'], 'kich-ban': ['run', 'Chờ duyệt kịch bản + storyboard'], phim: ['ok', `Đã có phim${e.seconds ? ` · ${e.seconds} giây` : ''}`] }[state];
    const plan = [e.logline && h('p', {}, e.logline), e.hook && h('p', {}, h('span', { class: 'k' }, 'Mở đầu'), e.hook), e.beats?.length ? h('ol', {}, e.beats.map((x) => h('li', {}, x))) : null, e.visual && h('p', {}, h('span', { class: 'k' }, 'Hình'), e.visual), e.cta && h('p', {}, h('span', { class: 'k' }, 'Kết'), e.cta)];
    const board = e.board.length ? h('div', { class: 'board' }, e.board.map((f) => h('img', { loading: 'lazy', src: file(`${base}/storyboard/${f}`, e.mtime || Date.now() / 6e4), alt: f, onclick: (ev) => zoom(ev.target.src) }))) : null;
    const layout = e.issues == null ? null : e.issues.length ? h('div', { class: 'note warn' }, h('b', {}, `Bố cục còn ${e.issues.length} chỗ chồng lấn: `), e.issues.slice(0, 4).join(' · ')) : h('span', { class: 'pill ok' }, '✓ bố cục sạch');
    const links = h('div', { class: 'row small' }, e.script && h('a', { href: file(`${base}/script.md`), target: '_blank' }, 'Đọc kịch bản'), e.board.length ? h('a', { href: file(`${base}/storyboard/index.html`), target: '_blank' }, 'Storyboard đầy đủ') : null, layout);
    const fbKey = `${slug}:fix:${e.number}`;
    const fb = fbBox(fbKey, state === 'phim' ? 'Góp ý cho phim: cảnh nào, câu nào cần sửa… Claude sửa rồi dựng lại.' : 'Góp ý cho kịch bản/storyboard: cảnh nào, câu nào cần sửa…');
    const fix = h('details', { open: !!DRAFT.get(fbKey) }, h('summary', {}, 'Góp ý để sửa'), h('div', { class: 'grid', style: { gap: '10px' } }, fb, h('div', { class: 'row' }, aiBtn('Sửa theo góp ý', slug, 'fix', e.number, () => fb.value, ''))));
    let body;
    if (state === 'de-xuat') body = [plan, h('div', { class: 'row' }, h('button', { class: 'btn pri', onclick: async () => { await api('POST', `/api/series/${slug}/approve`, { episodes: [e.number] }); openSeries(slug, true); } }, 'Duyệt tập này'))];
    else if (state === 'duyet') {
      const nk = `${slug}:script:${e.number}`, note = fbBox(nk, 'Lưu ý riêng cho tập này (không bắt buộc)');
      body = [plan, h('details', { open: !!DRAFT.get(nk) }, h('summary', {}, 'Thêm lưu ý cho tập này'), note), h('div', { class: 'row' }, aiBtn('Viết kịch bản + storyboard', slug, 'script', e.number, () => note.value))];
    } else if (state === 'kich-ban') body = [board ?? h('div', { class: 'note' }, 'Đã có kịch bản nhưng chưa vẽ storyboard.'), links,
      h('div', { class: 'row' }, h('button', { class: 'btn pri', 'data-job': 1, disabled: busy(), onclick: () => runJob(slug, 'render', e.number) }, 'Duyệt và dựng phim'), h('span', { class: 'mut small' }, 'Đọc giọng → căn thời gian → trộn âm → xuất MP4, vài phút.')), fix,
      h('details', {}, h('summary', {}, 'Xem lại kế hoạch tập'), h('div', { class: 'grid', style: { gap: '8px' } }, plan))];
    else body = [h('div', { class: 'film' },
        h('video', { controls: true, preload: 'none', poster: e.board[0] ? file(`${base}/storyboard/${e.board[0]}`, e.mtime) : null, class: d.format === '16:9' ? 'wide' : '', src: file(`${base}/out/${e.id}.mp4`, e.mtime) }),
        h('div', { class: 'grid', style: { gap: '12px' } },
          e.stale ? h('div', { class: 'note warn' }, 'Kịch bản đã sửa sau lần dựng này — bấm "Dựng lại" để có bản mới.') : null,
          h('div', { class: 'row' }, h('a', { class: 'btn dark', href: file(`${base}/out/${e.id}.mp4`), download: `${slug}-${e.id}.mp4` }, 'Tải MP4'), e.srt && h('a', { class: 'btn', href: file(`${base}/out/${e.id}.srt`), download: `${slug}-${e.id}.srt` }, 'Phụ đề SRT'),
            h('button', { class: 'btn', 'data-job': 1, disabled: busy(), onclick: () => runJob(slug, 'render', e.number) }, 'Dựng lại')),
          driveRow(e), links, fix)),
      board && h('details', {}, h('summary', {}, `Storyboard (${e.board.length} cảnh)`), board)];
    return h('div', { class: 'card ep', id: e.id }, h('div', { class: 'hd' }, h('div', { class: 'no' }, String(e.number).padStart(2, '0')), h('div', { style: { flex: 1 } }, h('h3', {}, e.title || `Tập ${e.number}`), h('div', { class: 'mut small' }, e.duration ? `khoảng ${e.duration} giây` : '')), h('span', { class: `pill ${chip[0]}` }, chip[1])), body);
  };

  const planKey = `${slug}:plan:`, planFb = fbBox(planKey, nPlan ? 'Góp ý cho kế hoạch: thêm/bớt tập, đổi góc nhìn, đổi thứ tự…' : 'Lưu ý thêm cho lần lập kế hoạch (không bắt buộc)');
  const planCard = nPlan
    ? h('details', { class: 'card', open: !!DRAFT.get(planKey) }, h('summary', {}, 'Lập lại kế hoạch theo góp ý'), h('div', { class: 'grid', style: { gap: '10px' } }, h('p', { class: 'mut small', style: { margin: 0 } }, 'Tập đã duyệt hoặc đã có kịch bản được giữ nguyên, trừ khi góp ý yêu cầu đổi.'), planFb, h('div', { class: 'row' }, aiBtn('Lập lại kế hoạch', slug, 'plan', null, () => planFb.value, ''))))
    : h('div', { class: 'card grid' }, h('div', {}, h('h2', {}, 'Bước 1 — Lập kế hoạch từng tập'), h('p', { class: 'mut', style: { margin: '4px 0 0' } }, `Claude đọc đề bài và đề xuất ${d.total || ''} tập: tiêu đề, câu mở đầu, các ý chính, hình ảnh, lời kết. Bạn duyệt từng tập trước khi viết kịch bản.`)), planFb, h('div', { class: 'row' }, aiBtn('Lập kế hoạch', slug, 'plan', null, () => planFb.value)));

  const b = d.brief;
  app.replaceChildren(
    h('div', { class: 'row' }, h('div', {}, h('h1', {}, d.name), h('div', { class: 'mut' }, [d.channel, `${d.total || eps.length} tập`, d.format, THEME[d.theme] ?? d.theme, `${d.characters} nhân vật`].filter(Boolean).join(' · '))), h('span', { class: 'sp' }), h('a', { class: 'btn', href: `#/s/${slug}/edit` }, 'Sửa đề bài')),
    h('div', { class: 'steps' },
      step(1, 'Kế hoạch', nPlan ? `${nPlan} tập · ${nPlan - pending.length} đã duyệt` : 'chưa lập', nPlan && !pending.length ? 'done' : 'cur'),
      step(2, 'Kịch bản + storyboard', `${nScript} tập`, nScript && nScript >= nPlan ? 'done' : nPlan ? 'cur' : ''),
      step(3, 'Phim', `${nFilm} tập đã dựng`, nFilm && nFilm >= nPlan ? 'done' : nScript ? 'cur' : '')),
    h('div', { class: 'cols' },
      h('div', { class: 'grid' },
        !nPlan ? planCard : null,
        pending.length > 1 ? h('div', { class: 'card row' }, h('div', {}, h('b', {}, `${pending.length} tập đang chờ duyệt kế hoạch`), h('div', { class: 'mut small' }, 'Đọc từng tập bên dưới, duyệt riêng hoặc duyệt hết.')), h('span', { class: 'sp' }), h('button', { class: 'btn pri', onclick: async () => { await api('POST', `/api/series/${slug}/approve`, { episodes: pending.map((e) => e.number) }); openSeries(slug, true); } }, 'Duyệt tất cả')) : null,
        eps.map(epCard),
        nPlan ? planCard : null),
      h('div', { class: 'side' },
        h('div', { class: 'card', id: 'jobbox' }),
        d.notes ? h('div', { class: 'card' }, h('h3', {}, 'Ghi chú của Claude'), h('div', { class: 'sum small', style: { marginTop: '8px' } }, d.notes)) : null,
        d.characters ? h('div', { class: 'card grid', style: { gap: '12px' } }, h('div', { class: 'row' }, h('h3', {}, 'Nhân vật'), h('span', { class: 'sp' }), h('button', { class: 'btn sm', 'data-job': 1, disabled: busy(), onclick: () => runJob(slug, 'characters') }, d.charactersPng ? 'Vẽ lại' : 'Vẽ bảng nhân vật')),
          d.charactersPng ? h('img', { class: 'chars', src: file('characters.png', d.charactersPng), alt: 'Bảng nhân vật', onclick: (ev) => zoom(ev.target.src) }) : h('p', { class: 'mut small', style: { margin: 0 } }, 'Chưa có bảng nhân vật.'),
          h('div', { class: 'small mut' }, d.bible.characters.map((c) => `${c.name} (${c.gender === 'nu' ? 'nữ' : 'nam'}${c.villain ? ', phản diện' : ''})`).join(' · '))) : null,
        b ? h('div', { class: 'card' }, h('h3', {}, 'Đề bài'), h('p', { class: 'small', style: { margin: '8px 0 0' } }, b.idea), h('div', { class: 'small mut', style: { marginTop: '8px' } }, [STYLE[b.style]?.[0], `${b.duration} giây/tập`, b.audience, b.platform].filter(Boolean).join(' · '))) : null,
        h('details', { class: 'card' }, h('summary', {}, 'Làm trong Claude Code thay vì bấm nút'), h('div', { class: 'grid', style: { gap: '8px' } }, h('p', { class: 'small mut', style: { margin: 0 } }, 'Dán câu lệnh này vào Claude Code (mở ở thư mục xưởng). Đổi giai đoạn thành plan, script hoặc fix và thêm số tập.'), h('code', { class: 'cmd' }, cmdText(slug, 'plan')), h('div', {}, h('button', { class: 'btn sm', onclick: () => copy(cmdText(slug, 'plan')) }, 'Chép')))))));
  jobPanel();
  if (keepScroll) window.scrollTo(0, y);
};

// ───────── điều hướng
const route = async () => {
  const [hpath, hq] = location.hash.split('?');
  const [, a, b, c] = hpath.split('/');
  const qs = new URLSearchParams(hq ?? '');
  if (qs.get('drive') === 'ok') toast('Đã kết nối Google Drive.');
  if (qs.get('drive_err')) toast(qs.get('drive_err'), true);
  if (hq) history.replaceState(null, '', hpath || '#/');
  document.getElementById('nav-home').className = !a ? 'on' : '';
  document.getElementById('nav-new').className = a === 'new' ? 'on' : '';
  document.getElementById('nav-drive').className = a === 'drive' ? 'on' : '';
  try {
    if (!META) META = await api('GET', '/api/meta');
    DRIVE = await api('GET', '/api/drive');
    if (a === 'drive') await driveView();
    else if (a === 'new') await formView();
    else if (a === 's' && b && c === 'edit') await formView(b);
    else if (a === 's' && b) await openSeries(b);
    else await home();
    if (a !== 's' || c === 'edit') window.scrollTo(0, 0);
  } catch (e) { app.replaceChildren(h('div', { class: 'card' }, h('h2', {}, 'Không tải được'), h('p', { class: 'mut' }, e.message), h('a', { class: 'btn', href: '#/' }, 'Về danh sách'))); }
};
addEventListener('hashchange', route);
route().then(poll);
</script>
